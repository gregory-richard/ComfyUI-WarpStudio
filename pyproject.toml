[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warp-studio"
version = "1.0.0"
description = "An all-in-one ComfyUI node suite that simplifies model management, streamlines workflows, and makes prompting easier."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["requests>=2.31.0", "Pillow>=10.0.0", "imageio-ffmpeg>=0.4.9", "send2trash>=1.8"]
authors = [
    {name = "gregory-richard"}
]
keywords = ["comfyui", "custom-nodes", "workflow", "data-transfer", "lora", "civitai", "prompt", "model-management"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Repository = "https://github.com/gregory-richard/ComfyUI-WarpStudio"
"Homepage" = "https://github.com/gregory-richard/ComfyUI-WarpStudio"
"Bug Reports" = "https://github.com/gregory-richard/ComfyUI-WarpStudio/issues"
"Source" = "https://github.com/gregory-richard/ComfyUI-WarpStudio"

[tool.setuptools]
packages = ["warp_studio", "warp_studio.comfy_updater", "warp_studio.studio"]

[tool.setuptools.package-dir]
warp_studio = "."

[tool.setuptools.package-data]
# web/*.js is not optional: WEB_DIRECTORY points ComfyUI at ./web, and without
# it an installed wheel has a frontend directory containing only documentation.
# The whole prompt UI, the library browser and the save node's labels are there.
warp_studio = ["version.txt", "node_list.json", "web/*.js", "web/*.svg", "standdown/*.js", "web/docs/*.md", "web/vendor/*.js", "web/vendor/LICENSE-codemirror.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests/updater"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["comfy_updater", "tools", "tests/updater"]

[tool.ruff.lint]
# Rules are selected explicitly so lint results are a property of this repo
# rather than of whichever ruff release CI happens to install.
#
# Deliberately NOT selected:
#   FA  - would add `from __future__ import annotations`, turning every
#         annotation into a string at runtime. ComfyUI's V3 schema machinery
#         cannot be exercised locally, so the rewrite carries risk it does
#         not repay.
#   N   - naming rules. ComfyUI dictates both the method names (INPUT_TYPES,
#         VALIDATE_INPUTS, IS_CHANGED) and the node-pack directory name, so
#         these findings can never be acted on.
select = ["E4", "E7", "E9", "F", "I", "RUF", "UP"]
ignore = [
    # Node display names intentionally use the spiral emoji and similar
    # characters; ruff reads them as ambiguous unicode.
    "RUF001",
    "RUF003",
]
[tool.comfy]
PublisherId = "gregrichrd"
DisplayName = "Warp Studio"
Icon = "https://raw.githubusercontent.com/gregory-richard/ComfyUI-WarpStudio/main/assets/registry/icon.png"
Banner = "https://raw.githubusercontent.com/gregory-richard/ComfyUI-WarpStudio/main/assets/registry/banner.png"
