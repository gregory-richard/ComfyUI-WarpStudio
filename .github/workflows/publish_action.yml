name: Publish to Comfy Registry
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  version:
    name: Check whether the version changed
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Need history to compare this commit's version against the previous one.
          fetch-depth: 0

      # The push trigger fires on any change to pyproject.toml, not just a
      # release. Without this gate, editing metadata or tool config re-publishes
      # the current version, which the registry rejects and which turns the run
      # red. Manual runs always publish. This is its own job so an unchanged
      # version also skips the test run below.
      - name: Check whether the version changed
        id: version
        run: |
          current=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          echo "current=$current" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "push" ]; then
            echo "Manual run: publishing $current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before="${{ github.event.before }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "No usable previous commit: publishing $current."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=$(git show "$before:pyproject.toml" 2>/dev/null \
                     | grep -m1 '^version = ' | cut -d'"' -f2 || true)
          if [ "$current" = "$previous" ]; then
            echo "Version unchanged at $current: skipping publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version changed ${previous:-none} -> $current: publishing."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  # A version bump used to publish even when the tests failed, because this
  # workflow ran apart from test.yml. Publishing now needs this job to pass.
  test:
    name: Run the test workflow
    needs: version
    if: needs.version.outputs.changed == 'true'
    uses: ./.github/workflows/test.yml

  publish-node:
    name: Publish Custom Node to Registry
    needs: [version, test]
    if: needs.version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      # The action reads pyproject.toml from the workspace, and this job runs on
      # a fresh runner, so it needs its own checkout.
      - name: Checkout code
        uses: actions/checkout@v4

      # Pinned to a commit: this action receives the registry token, and a
      # moving branch would let an upstream push run new code with it.
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@d2366e7abb6ab16f3bb03e3520ae25c8cf749bc9 # main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
